<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이름 해석기</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>이름 해석기</h1>
        
        <div class="intro">
            <p>엄청난 비밀이 담긴 여러분의 이름을 해석해 드립니다.</p>
        </div>
        
        <div class="input-section">
            <label for="nameInput">이름을 한자 뜻과 음으로 입력하세요</label>
            <input type="text" id="nameInput" placeholder="예: 쇠김 물수 남쪽남" autofocus>
            <button id="analyzeBtn">이름 해석하기</button>
            <div class="error" id="errorMsg"></div>
        </div>
        
        <div class="loading" id="loadingIndicator">
            <i class="fas fa-spinner"></i>
            <p>이름을 분석 중입니다...</p>
        </div>
        
        <div class="result" id="resultSection">
            <div id="characterAnalyses"></div>
            
            <div class="full-name-analysis">
                <h2>전체 이름 해석</h2>
                <div id="fullNameAnalysis"></div>
            </div>
        </div>
        
        <div class="examples">
            <h3>입력 예시</h3>
            <p><strong>입력 형식:</strong> [한자뜻][한자음] [한자뜻][한자음] [한자뜻][한자음]</p>
            <p>'이름이 '김수남'인 경우 쇠김 물수 남쪽남 형식으로 입력해 주세요.</p>
        </div>
        
        <footer>
            <p>© 2025 이름 해석기 | AI 기반 이름 분석 서비스</p>
        </footer>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
