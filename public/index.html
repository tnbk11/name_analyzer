<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src *; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.gstatic.com https://cdnjs.cloudflare.com https://developers.kakao.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https://developers.kakao.com https://*.firebasestorage.app;">
    
    <!-- 오픈그래프 메타태그 (SNS 공유 시 필요) -->
    <meta property="og:title" content="이름 해석기 - 당신의 이름에 담긴 비밀">
    <meta property="og:description" content="당신의 이름에 담긴 의미를 알아보세요">
    <meta property="og:image" content="https://name-analyzer.onrender.com/images/og-image.jpg">
    <meta property="og:url" content="https://name-analyzer.onrender.com">
    <meta property="og:type" content="website">
    
    <!-- 동적 메타태그 업데이트를 위한 스크립트 -->
    <script>
        // URL 파라미터 확인
        const urlParams = new URLSearchParams(window.location.search);
        const userName = urlParams.get('user');
        
        // 사용자 이름이 있을 경우 메타 태그 업데이트
        if (userName) {
            document.title = `${userName}님의 이름 해석 결과`;
            
            // 오픈그래프 타이틀 업데이트
            const ogTitle = document.querySelector('meta[property="og:title"]');
            if (ogTitle) {
                ogTitle.setAttribute('content', `${userName}님의 이름 해석입니다`);
            }
            
            // 설명 업데이트 (세션 스토리지에서 가져온 설명 있는 경우)
            const savedAnalysis = sessionStorage.getItem('currentAnalysis');
            if (savedAnalysis) {
                try {
                    const analysis = JSON.parse(savedAnalysis);
                    const plainText = analysis.fullNameAnalysis
                        .replace(/\*\*/g, '')
                        .replace(/•/g, '')
                        .substring(0, 100) + '...';
                    
                    const ogDesc = document.querySelector('meta[property="og:description"]');
                    if (ogDesc) {
                        ogDesc.setAttribute('content', plainText);
                    }
                } catch (e) {
                    console.error('메타태그 업데이트 오류:', e);
                }
            }
        }
    </script>
    
    <title>이름 해석기</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <!-- 카카오 SDK 추가 -->
    <script src="https://developers.kakao.com/sdk/js/kakao.js"></script>
</head>

<!-- Firebase SDK (</body> 태그 전에 배치) -->
<script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-database-compat.js"></script>
<script>
  // Firebase 구성
  const firebaseConfig = {
    apiKey: "AIzaSyCFQ7p-vccGs3EPtE_K4vZFW3idGVC-9PY",
    authDomain: "name-analyzer.firebaseapp.com",
    databaseURL: "https://name-analyzer-default-rtdb.asia-southeast1.firebasedatabase.app", // 이 부분 추가 필요
    projectId: "name-analyzer",
    storageBucket: "name-analyzer.appspot.com",
    messagingSenderId: "259858433705",
    appId: "1:259858433705:web:9f68ce54a5761ab0ff4bb8",
    measurementId: "G-2PM8N0FVK4"
  };

  // Firebase 초기화
  firebase.initializeApp(firebaseConfig);
</script>

<body>
    <div class="container">
        <h1>이름 해석기</h1>
        
        <div class="intro">
            <p>당신의 이름에 담긴 비밀을 알아보세요.</p>
        </div>
        
        <div class="input-section">
            <label for="nameInput">이름을 한자 뜻과 음으로 입력하세요</label>
            <input type="text" id="nameInput" placeholder="예: 쇠김 물수 남쪽남" autofocus>
            <button id="analyzeBtn">이름 해석하기</button>
            <div class="error" id="errorMsg"></div>
        </div>
        
        <div class="loading" id="loadingIndicator">
            <i class="fas fa-spinner"></i>
            <p>이름을 분석 중입니다...</p>
        </div>
        
        <div class="result" id="resultSection">
            <div id="characterAnalyses" style="display: none;"></div>
            
            <div class="full-name-analysis">
                <h2>당신의 이름 해석</h2>
                <div id="fullNameAnalysis"></div>
            </div>
            
            <div class="disclaimer">
                <p>이름 해석은 재미로만 봐주세요! 맞으면 다행, 틀려도 제 탓 아님 😎</p>
            </div>
            
            <!-- 공유 버튼 추가 -->
            <div class="share-buttons">
                <button id="kakaoShareBtn" class="share-btn kakao-btn">
                    <img src="https://developers.kakao.com/assets/img/about/logos/kakaolink/kakaolink_btn_small.png" alt="카카오톡 공유">
                    카카오톡 공유
                </button>
                <button id="copyLinkBtn" class="share-btn link-btn">
                    <i class="fas fa-link"></i> 링크 복사
                </button>
                <div id="linkCopiedMsg" class="link-copied-msg">링크가 복사되었습니다!</div>
            </div>
        </div>
        
        <footer>
            <p>© 2025 이름 해석기 | AI 기반 이름 분석 서비스</p>
        </footer>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
