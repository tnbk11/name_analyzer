<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="이름 해석기 - 당신의 이름에 담긴 비밀">
    <meta property="og:description" content="당신의 이름에 담긴 의미를 해석해 드립니다.">
    <meta property="og:image" content="https://your-site.com/images/og-image.jpg">
    <title>이름 해석기</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <!-- 카카오 SDK 추가 -->
    <script src="https://developers.kakao.com/sdk/js/kakao.js"></script>
</head>
<body>
    <div class="container">
        <h1>이름 해석기</h1>
        
        <div class="intro">
            <p>당신의 이름에 담긴 비밀을 알아보세요.</p>
        </div>
        
        <div class="input-section">
            <label for="nameInput">이름을 한자 뜻과 음으로 입력하세요</label>
            <input type="text" id="nameInput" placeholder="예: 쇠김 물수 남쪽남" autofocus>
            <button id="analyzeBtn">이름 해석하기</button>
            <div class="error" id="errorMsg"></div>
        </div>
        
        <div class="loading" id="loadingIndicator">
            <i class="fas fa-spinner"></i>
            <p>이름을 분석 중입니다...</p>
        </div>
        
        <div class="result" id="resultSection">
            <div id="characterAnalyses" style="display: none;"></div>
            
            <div class="full-name-analysis">
                <h2>당신의 이름 해석</h2>
                <div id="fullNameAnalysis"></div>
            </div>
            
            <div class="disclaimer">
                <p>이름 해석은 재미로만 봐주세요! 맞으면 다행, 틀려도 제 탓 아님 😎</p>
            </div>
            
            <!-- 공유 버튼 추가 -->
            <div class="share-buttons">
                <button id="kakaoShareBtn" class="share-btn kakao-btn">
                    <img src="https://developers.kakao.com/assets/img/about/logos/kakaolink/kakaolink_btn_small.png" alt="카카오톡 공유">
                    카카오톡 공유
                </button>
                <button id="copyLinkBtn" class="share-btn link-btn">
                    <i class="fas fa-link"></i> 링크 복사
                </button>
                <div id="linkCopiedMsg" class="link-copied-msg">링크가 복사되었습니다!</div>
            </div>
        </div>
        
        <footer>
            <p>© 2025 이름 해석기 | AI 기반 이름 분석 서비스</p>
        </footer>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
